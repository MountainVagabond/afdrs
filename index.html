<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tas Fire Danger Overlay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,sans-serif;background:#111}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;color:#222;padding:10px 12px;border-radius:8px;
         box-shadow:0 2px 10px rgba(0,0,0,.3);width:230px;max-width:calc(100vw - 52px);max-height:calc(100vh - 40px);overflow:auto}
  .panel h1{font-size:15px;margin:0 0 8px}
  .panel label{display:block;margin:8px 0 2px;font-weight:600;font-size:12px}
  .panel select,.panel input[type=range]{width:100%}
  .days{display:flex;gap:4px}.days button{flex:1;padding:5px 0;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer;font-size:12px}
  .days button.on{background:#c8102e;color:#fff;border-color:#c8102e}
  .legend{margin-top:8px;font-size:12px}.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
  .legend span{width:14px;height:14px;border:1px solid #999;display:inline-block}
  .small{font-size:11px;color:#666;margin-top:6px}
  .row{display:flex;gap:6px;margin-top:8px}.row button{flex:1;font-size:12px;padding:4px;cursor:pointer}
  .h{width:12px;height:12px;margin:-8px 0 0 -8px;border:2px solid #fff;box-shadow:0 0 3px #000;box-sizing:content-box}
  .h.blue{background:#0af;border-radius:50%}
  .h.orange{background:#f80;border-radius:3px}
  .h.big{width:28px;height:28px;margin:-17px 0 0 -17px;border-width:3px;opacity:.95}
  .h.big::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#000;border-radius:50%}
  .row button:disabled{opacity:.4}
  #toggle{display:none}
  #status:empty{display:none}
  @media (max-width:520px){
    #toggle{display:block;width:100%;padding:5px;font-size:13px;cursor:pointer}
    .panel.collapsed{padding:6px;width:200px}
    .panel.collapsed > :not(#toggle):not(#days):not(#status){display:none}
    .panel.collapsed #days{margin-top:6px}
    .panel.collapsed #status{margin-top:4px}
  }
  /* ---- search bar, pins ---- */
  #searchbar{position:absolute;z-index:1001;left:10px;bottom:26px;display:flex;gap:4px;background:#fff;padding:5px;border-radius:8px;
             box-shadow:0 2px 10px rgba(0,0,0,.3);width:min(400px,calc(100vw - 40px));box-sizing:border-box}
  #q{flex:1;min-width:0;font-size:16px;padding:5px 7px;border:1px solid #bbb;border-radius:4px}
  #searchbar button{font-size:16px;line-height:1;padding:4px 7px;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer}
  #searchbar button.on{background:#c8102e;border-color:#c8102e}
  #results{position:absolute;z-index:1001;left:10px;bottom:72px;width:min(400px,calc(100vw - 40px));box-sizing:border-box;background:#fff;
           border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:40vh;overflow:auto;font-size:13px}
  #results:empty{display:none}
  #results div{padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer}
  #results div:hover{background:#f4f4f4}
  #results .msg{cursor:default;color:#666}
  .pinicon{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #222;box-shadow:0 1px 4px rgba(0,0,0,.5);position:relative}
  .pinicon::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#222}
  .pinpop{min-width:190px;font-size:12px}
  .pinpop input{width:100%;box-sizing:border-box;font:600 13px system-ui,sans-serif;padding:3px 5px;border:1px solid #ccc;border-radius:4px}
  .pinpop .pc{margin:6px 0;color:#333;line-height:1.5}
  .pinpop .fdr{margin:4px 0 8px}.pinpop .fdr b{padding:1px 6px;border-radius:3px;border:1px solid #999}
  .pinpop .pb{display:flex;gap:4px}.pinpop .pb button,.pinpop .pb a{flex:1;font-size:12px;padding:4px;text-align:center;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;color:#222;text-decoration:none;cursor:pointer}
  #pinlist div{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;font-size:12px}
  #pinlist span.sw{width:10px;height:10px;border-radius:50%;border:1px solid #333;flex:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="results"></div>
<div id="searchbar">
  <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Address, lat/long or MGA55 E N">
  <button id="go" title="Search">🔍</button>
  <button id="pinmode" title="Drop a pin: tap this, then tap the map (or long-press / right-click the map)">📍</button>
  <button id="locate" title="Show my location">🎯</button>
</div>
<div class="panel" id="panel">
  <h1>TFS Fire Danger Rating</h1>
  <button id="toggle">Show / hide controls</button>
  <label>Source</label>
  <select id="source">
    <option value="live">Live — fire.tas.gov.au (today)</option>
    <option value="archive">Archive — past days</option>
  </select>
  <div id="archiveBox" style="display:none">
    <label>Archive address (GitHub user/repo)</label>
    <input type="text" id="repo" placeholder="e.g. MountainVagabond/tfs-fdr-archive" style="width:100%;box-sizing:border-box;font-size:12px">
    <label>Access key (GitHub token, for a private archive)</label>
    <input type="password" id="token" placeholder="github_pat_… — remembered on this device" autocomplete="off" style="width:100%;box-sizing:border-box;font-size:12px">
    <label>Date issued</label>
    <select id="date"></select>
    <label>Issue time</label>
    <select id="run"></select>
  </div>
  <label>Forecast day</label>
  <div class="days" id="days">
    <button data-d="0" class="on">Today</button><button data-d="1">Tmrw</button><button data-d="2">Day 2</button><button data-d="3">Day 3</button>
  </div>
  <label>Overlay opacity <span id="opv">70%</span></label>
  <input type="range" id="op" min="0" max="100" value="70">
  <label>Basemap</label>
  <select id="base">
    <option value="satlab">Satellite + place names (Esri)</option>
    <option value="street">Streets (Esri)</option>
    <option value="carto">Streets (CARTO)</option>
    <option value="light">Light (CARTO)</option>
    <option value="topo">Topographic (Esri)</option>
    <option value="sat">Esri satellite</option>
  </select>
  <label>FDR coastline outline</label>
  <select id="outline">
    <option value="magenta">Magenta</option>
    <option value="cyan">Cyan</option>
    <option value="yellow">Yellow</option>
    <option value="red">Red</option>
    <option value="off">Off</option>
  </select>
  <div class="legend">
    <div><span style="background:#fff"></span>No rating</div>
    <div><span style="background:#64bf30"></span>Moderate</div>
    <div><span style="background:#ffe033"></span>High</div>
    <div><span style="background:#f58220"></span>Extreme</div>
    <div><span style="background:#b11a1a"></span>Catastrophic</div>
  </div>
  <label>Image projection</label>
  <select id="proj">
    <option value="tm">MGA zone 55 (fitted, best)</option>
    <option value="latlon">Lat/long grid (reprojected)</option>
    <option value="merc">As-is (no reprojection)</option>
  </select>
  <label>Control grid</label>
  <select id="grid">
    <option value="4">4 × 4 points (coarse)</option>
    <option value="6">6 × 6</option>
    <option value="8">8 × 8</option>
    <option value="12">12 × 12</option>
    <option value="16">16 × 16 (fine)</option>
  </select>
  <div class="row">
    <button id="align">Align overlay</button>
    <button id="undo">Undo</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row">
    <button id="exp">Copy alignment</button>
    <button id="imp">Paste alignment</button>
  </div>
  <label>Pins <button id="clearpins" style="float:right;font-size:11px;padding:1px 6px;cursor:pointer">Clear all</button></label>
  <div id="pinlist" class="small">No pins yet — long-press the map or use 📍.</div>
  <label>Load PNG from file</label>
  <input type="file" id="file" accept="image/png,image/*" style="width:100%;font-size:12px">
  <div class="small" id="status">Loading overlay…</div>
  <div class="small">Images: fire.tas.gov.au (refreshed morning and ~4:30pm). Not for safety decisions — check TFS directly.</div>
</div>

<script>
const LIVE = d => `https://www.fire.tas.gov.au/AFDRS/IDZ10136_AUS_AFDRS_max_fdr_SFC_Tas_Only_Day${d}.png?t=${new Date().toISOString().slice(0,13)}`;

const DEFAULT = [[-43.85, 143.30], [-39.35, 148.64]];
const OLD_KEY = 'tfsOverlayBounds', PKEY = 'tfsOverlayProj3', MKEY = 'tfsMesh3';
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = id => document.getElementById(id);
const statusEl = $('status');

/* ---------- Archive (GitHub repository filled by tfs_fdr_archive.py) ---------- */
const RKEY = 'tfsArchiveRepo', TKEY = 'tfsArchiveToken';
let source = 'live', index = null;          // index: {date: {"Day0.png": [filenames...], ...}}
const repoName = () => ($('repo').value || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
const repoBase = () => repoName() ? `https://api.github.com/repos/${repoName()}/contents/fdr_archive` : null;
// Read a file from the archive through GitHub's API (works for public repos, and private ones with a token)
async function ghFetch(url){
  const tok = ($('token').value || '').trim(), h = {Accept: 'application/vnd.github.raw+json'};
  if(tok) h.Authorization = 'Bearer ' + tok;
  const r = await fetch(url, {headers: h, cache: 'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r;
}
const archiveError = code => code == 401 ? 'The access key was rejected — check it, or that it hasn’t expired.'
  : code == 404 ? 'Archive not found — check the user/repo address, and if the archive is private, that the access key is entered and allowed to read it.'
  : code == 403 ? 'GitHub refused the request (too many requests without a key, or the key lacks access).'
  : 'Couldn’t reach GitHub.';
function archiveFile(d){
  // newest file for Day d whose issue stamp is not after the chosen issue time (unchanged images aren't re-saved)
  const date = $('date').value, run = $('run').value, list = index && index[date] && index[date][`Day${d}.png`] || [];
  const ok = list.filter(f => f.slice(0,15) <= run);
  return ok.length ? ok[ok.length-1] : null;
}
const SRC = d => {
  if(source === 'live') return LIVE(d);
  const f = archiveFile(d); return f ? `${repoBase()}/${$('date').value}/${f}` : null;
};
async function loadIndex(){
  const base = repoBase(); if(!base){ statusEl.textContent = 'Enter the archive address (GitHub user/repo).'; return; }
  statusEl.textContent = 'Reading archive index…';
  try {
    index = await (await ghFetch(`${base}/index.json`)).json();
  } catch(e){ statusEl.innerHTML = `<b style="color:#c8102e">Couldn’t read the archive.</b> ${archiveError(e.message)}`; index = null; return; }
  ls.set(RKEY, $('repo').value.trim()); ls.set(TKEY, $('token').value.trim());
  const dates = Object.keys(index).sort().reverse();
  $('date').innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
  fillRuns(); loadDay(day);
}
function fillRuns(){
  const date = $('date').value, files = index && index[date] || {};
  const stamps = [...new Set(Object.values(files).flat().map(f => f.slice(0,15)))].sort();
  $('run').innerHTML = stamps.map(s => `<option value="${s}">${s.slice(11,13)}:${s.slice(13,15)}</option>`).join('');
  $('run').value = stamps[stamps.length-1] || '';
}
$('source').onchange = e => {
  source = e.target.value; $('archiveBox').style.display = source === 'archive' ? '' : 'none';
  if(source === 'archive'){ if(index) loadDay(day); else loadIndex(); } else loadDay(day);
};
$('repo').value = ls.get(RKEY) || 'MountainVagabond/tfs-fdr-archive';
$('token').value = ls.get(TKEY) || '';
$('repo').onchange = loadIndex;
$('token').onchange = loadIndex;
$('date').onchange = () => { fillRuns(); loadDay(day); };
$('run').onchange = () => loadDay(day);

const map = L.map('map', {zoomControl:true}).setView([-41.9, 146.6], 7);
const bases = {
  // CARTO / Esri tiles work from a local file; OpenStreetMap's own servers block pages opened from disk
  satlab: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
  ]),
  street: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
  carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}),
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}),
  topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'})
};
let base = bases.satlab.addTo(map);
$('base').onchange = e => { map.removeLayer(base); base = bases[e.target.value].addTo(map); };

// ImageOverlay that shows a <canvas>
const CanvasOverlay = L.ImageOverlay.extend({
  _initImage(){
    const c = this._image = this._url;
    L.DomUtil.addClass(c, 'leaflet-image-layer');
    if (this._zoomAnimated) L.DomUtil.addClass(c, 'leaflet-zoom-animated');
    c.onselectstart = L.Util.falseFn; c.onmousemove = L.Util.falseFn;
    this._updateOpacity();
  }
});

/* ---------- Mesh: an n×n grid of control points pinned to the image ---------- */
const CRS = L.CRS.EPSG3857;
const P = ll => CRS.project(L.latLng(ll[0], ll[1]));          // [lat,lng] -> metres
const U = p => { const l = CRS.unproject(p); return [l.lat, l.lng]; };
const mercLat = (N, S, t) => { const m = l => Math.log(Math.tan(Math.PI/4 + l*Math.PI/360)); const y = m(N) + (m(S)-m(N))*t; return (2*Math.atan(Math.exp(y)) - Math.PI/2)*180/Math.PI; };

let proj = ls.get(PKEY) || 'tm';
$('proj').value = proj;
let mesh = ls.get(MKEY);   // {n, nodes:[[lat,lng]...]} row-major, row 0 = top of image

// Fitted against Esri's detailed coastline: the TFS PNG is a GDA94/2020 MGA zone 55 grid (ellipsoidal Transverse
// Mercator, 147°E, k0 0.9996) with square ~161 m pixels. Image edges in MGA metres, plus small local corrections.
const TMFIT = {E0:221912.1, E1:630057.3, N0:5619564.3, N1:5159273.7, W:2535, H:2857,
  // [u px, v px, east corr m, north corr m] — smooth local tweaks measured region by region
  c:[[317,348,200,-600],[2218,348,-200,-400],[317,1044,0,-800],[951,1044,400,400],[1584,1044,0,200],[2218,1044,-50,250],
     [951,1741,150,-200],[1584,1741,50,-100],[2218,1741,100,0],[951,2437,-50,0],[1584,2437,300,-50],[2218,2437,0,0]]};
const mgaInv = (() => {
  const a=6378137, f=1/298.257222101, n=f/(2-f), A=a/(1+n)*(1+n*n/4+n**4/64), k0=0.9996, R=Math.PI/180;
  const be=[n/2-2*n*n/3+37*n**3/96, n*n/48+n**3/15, 17*n**3/480], de=[2*n-2*n*n/3-2*n**3, 7*n*n/3-8*n**3/5, 56*n**3/15];
  return (E, N) => {
    const xi=(N-1e7)/(k0*A), et=(E-5e5)/(k0*A); let xp=xi, ep=et;
    for(let j=1;j<=3;j++){ xp-=be[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*et); ep-=be[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*et); }
    const chi=Math.asin(Math.sin(xp)/Math.cosh(ep)); let p=chi;
    for(let j=1;j<=3;j++) p+=de[j-1]*Math.sin(2*j*chi);
    return [p/R, 147+Math.atan(Math.sinh(ep)/Math.cos(xp))/R];
  };
})();
function meshTM(n){
  const T = TMFIT, nodes = [];
  const corr = (u,v) => { let s=0,e=0,m=0; for(const c of T.c){ const w=1/((u-c[0])**2+(v-c[1])**2+1e4); s+=w; e+=w*c[2]; m+=w*c[3]; } return [e/s, m/s]; };
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const u=i/(n-1)*T.W, v=j/(n-1)*T.H, d=corr(u, Math.min(v,2785));
    nodes.push(mgaInv(T.E0+(T.E1-T.E0)*u/T.W+d[0], T.N0-(T.N0-T.N1)*v/T.H+d[1]));
  }
  return {n, nodes};
}
function meshFromBounds(b, n, pr){
  if(pr === 'tm') return meshTM(n);
  const [[S,W],[N,E]] = b, nodes = [];
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const t = j/(n-1);
    nodes.push([pr === 'latlon' ? N - (N-S)*t : mercLat(N,S,t), W + (E-W)*i/(n-1)]);
  }
  return {n, nodes};
}
if(!mesh || !mesh.nodes) mesh = meshFromBounds(DEFAULT, 16, proj);
$('grid').value = String(mesh.n);
const saveMesh = () => ls.set(MKEY, mesh);

// Where image point (u,v in 0..1) lands, in projected metres (same triangles as the renderer)
function warpAt(m, u, v){
  const n = m.n, gx = Math.min(u*(n-1), n-1-1e-9), gy = Math.min(v*(n-1), n-1-1e-9);
  const i = Math.floor(gx), j = Math.floor(gy), fx = gx-i, fy = gy-j;
  const q = (a,b) => P(m.nodes[(j+b)*n + i+a]);
  const p00=q(0,0), p10=q(1,0), p01=q(0,1), p11=q(1,1);
  return fy <= fx
    ? L.point(p00.x + fx*(p10.x-p00.x) + fy*(p11.x-p10.x), p00.y + fx*(p10.y-p00.y) + fy*(p11.y-p10.y))
    : L.point(p00.x + fy*(p01.x-p00.x) + fx*(p11.x-p01.x), p00.y + fy*(p01.y-p00.y) + fx*(p11.y-p01.y));
}
function resample(n){
  const nodes = [];
  for(let j=0;j<n;j++) for(let i=0;i<n;i++) nodes.push(U(warpAt(mesh, i/(n-1), j/(n-1))));
  mesh = {n, nodes};
}
function triangles(m){
  const n = m.n, t = [];
  for(let j=0;j<n-1;j++) for(let i=0;i<n-1;i++){
    const a=j*n+i, b=a+1, c=a+n, d=c+1;
    t.push([a,b,d],[a,d,c]);
  }
  return t;
}

/* ---------- Rendering ---------- */
let box = null, imgLayer = null, srcImg = null, srcBlend = false, opacity = .7, day = 0;
function render(){
  if(!srcImg) return;
  const sw = srcImg.naturalWidth || srcImg.width, sh = srcImg.naturalHeight || srcImg.height, n = mesh.n;
  const pts = mesh.nodes.map(P);
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const scale = Math.min(3000/(maxX-minX), 3000/(maxY-minY), sw*1.1/(maxX-minX));
  const out = document.createElement('canvas');
  out.width = Math.ceil((maxX-minX)*scale); out.height = Math.ceil((maxY-minY)*scale);
  const x = out.getContext('2d');
  const D = pts.map(p => [(p.x-minX)*scale, (maxY-p.y)*scale]);                 // canvas y down = north up
  const S = mesh.nodes.map((_,k) => [(k % n)/(n-1)*sw, Math.floor(k/n)/(n-1)*sh]);
  for(const [a,b,c] of triangles(mesh)){
    const [x0,y0]=S[a],[x1,y1]=S[b],[x2,y2]=S[c],[u0,v0]=D[a],[u1,v1]=D[b],[u2,v2]=D[c];
    const den = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0); if(!den) continue;
    const A = ((u1-u0)*(y2-y0) - (u2-u0)*(y1-y0))/den, C = ((u2-u0)*(x1-x0) - (u1-u0)*(x2-x0))/den;
    const B = ((v1-v0)*(y2-y0) - (v2-v0)*(y1-y0))/den, Dd = ((v2-v0)*(x1-x0) - (v1-v0)*(x2-x0))/den;
    const cx=(u0+u1+u2)/3, cy=(v0+v1+v2)/3, grow = p => { const dx=p[0]-cx, dy=p[1]-cy, l=Math.hypot(dx,dy)||1; return [p[0]+dx/l*.8, p[1]+dy/l*.8]; };
    const t = [grow([u0,v0]),grow([u1,v1]),grow([u2,v2])];

function keyed(img){
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img,0,0);
  const id = x.getImageData(0,0,W,H), p = id.data;   // throws if cross-origin
  // sea = flat mid-grey (≈225); land = white "no rating" or a rating colour

// MGA zone 55 (GDA2020/GDA94, GRS80): lat/long -> easting/northing (Krüger series, sub-mm accuracy)
const mgaFwd = (() => {
  const a=6378137, f=1/298.257222101, n=f/(2-f), A=a/(1+n)*(1+n*n/4+n**4/64), k0=0.9996, e=Math.sqrt(f*(2-f)), R=Math.PI/180;
  const al=[n/2-2*n*n/3+5*n**3/16, 13*n*n/48-3*n**3/5, 61*n**3/240];
  return (lat, lon) => {
    const ph=lat*R, dl=(lon-147)*R, t=Math.sinh(Math.atanh(Math.sin(ph)) - e*Math.atanh(e*Math.sin(ph)));
    const xp=Math.atan2(t, Math.cos(dl)), ep=Math.atanh(Math.sin(dl)/Math.sqrt(1+t*t));
    let xi=xp, et=ep;
    for(let j=1;j<=3;j++){ xi+=al[j-1]*Math.sin(2*j*xp)*Math.cosh(2*j*ep); et+=al[j-1]*Math.cos(2*j*xp)*Math.sinh(2*j*ep); }
    return [5e5 + k0*A*et, 1e7 + k0*A*xi];
  };
})();
const fmtMGA = (lat, lng) => { const [E,N] = mgaFwd(lat,lng); return `MGA55 E ${Math.round(E)} N ${Math.round(N)}`; };

// "-42.88, 147.33" · "42.88S 147.33E" · "147.33 -42.88" · "525000 5250000" · "55G 525000E 5250000N" -> {lat,lng} or null
function parseCoords(s){
  const nums = (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
  if(nums.length === 3 && (nums[0] === 54 || nums[0] === 55)) nums.shift();      // MGA zone prefix
  if(nums.length !== 2) return null;
  let [a, b] = nums;
  const ok = (la, lo) => la <= -9 && la >= -45 && lo >= 112 && lo <= 155;
  if(Math.abs(a) <= 180 && Math.abs(b) <= 180){                                    // degrees
    if(/s/i.test(s) && a > 0 && b > 0){ if(a < 90 && (b > 90 || a < b)) a = -a; else b = -b; }
    if(ok(a, b)) return {lat:a, lng:b};
    if(ok(b, a)) return {lat:b, lng:a};
    if(ok(-Math.abs(a), b)) return {lat:-Math.abs(a), lng:b};                     // latitude typed without the minus
    if(ok(-Math.abs(b), a)) return {lat:-Math.abs(b), lng:a};
    return null;
  }
  let E = a, N = b; if(a > 1e6 && b < 1e6){ E = b; N = a; }                        // MGA metres, either order
  if(E < 1e5 || E > 9e5 || N < 5e6 || N > 1e7) return null;
  const [la, lo] = mgaInv(E, N); return ok(la, lo) ? {lat:la, lng:lo} : null;
}

// Fire Danger Rating under a point, read from the overlay's source image (null if it can't be read)
const FDR = [['No rating',[255,255,255],'#ffffff'],['Moderate',[100,191,48],'#64bf30'],['High',[255,224,51],'#ffe033'],

  const img = sample && sample.img;
  if(!img || !mesh) return null;
  const p = P([lat,lng]), pts = mesh.nodes.map(P), n = mesh.n;
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const S = k => [(k % n)/(n-1)*sw, Math.floor(k/n)/(n-1)*sh];
  for(const t of triangles(mesh)){
    const [A,B,C] = t.map(k => pts[k]);
    const den = (B.y-C.y)*(A.x-C.x) + (C.x-B.x)*(A.y-C.y);
    const w1 = ((B.y-C.y)*(p.x-C.x) + (C.x-B.x)*(p.y-C.y))/den, w2 = ((C.y-A.y)*(p.x-C.x) + (A.x-C.x)*(p.y-C.y))/den, w3 = 1-w1-w2;
    if(w1 < -1e-9 || w2 < -1e-9 || w3 < -1e-9) continue;
    const [s0,s1,s2] = t.map(S), x = w1*s0[0]+w2*s1[0]+w3*s2[0], y = w1*s0[1]+w2*s1[1]+w3*s2[1];
    let d;
    try { const c = sampleCanvas.getContext('2d', {willReadFrequently:true}); c.clearRect(0,0,3,3);
          c.drawImage(img, Math.round(x)-1, Math.round(y)-1, 3, 3, 0, 0, 3, 3); d = c.getImageData(0,0,3,3).data; }
    catch(e){ return null; }                                                       // image from another site without permission
    const cls = i => { let best = 0, bd = Infinity; FDR.forEach((f, k) => { const dd = (d[i]-f[1][0])**2 + (d[i+1]-f[1][1])**2 + (d[i+2]-f[1][2])**2; if(dd < bd){ bd = dd; best = k; } }); return best; };
    const centre = cls(16);                                                        // pixel (1,1)
    if(FDR[centre][0]) return FDR[centre];
    const counts = {}; for(let i = 0; i < 36; i += 4){ const k = cls(i); if(FDR[k][0]) counts[k] = (counts[k] || 0) + 1; }
    const k = Object.keys(counts).sort((u, v) => counts[v] - counts[u])[0];
    return k !== undefined ? FDR[k] : ['Outside forecast area', null, null];
  }

}

    const idx = borrowIdx.data;

  const fdr = document.createElement('div'); fdr.className = 'fdr';
  const r = fdrAt(pin.lat, pin.lng);
  if(r && r[2]) fdr.innerHTML = `FDR (${dayLabel()}): <b style="background:${r[2]};color:${r[0]==='Catastrophic'?'#fff':'#222'}">${r[0]}</b>`;
  else if(r) fdr.textContent = `FDR (${dayLabel()}): ${r[0]}`;
  else fdr.textContent = borrowing ? 'Reading the rating…'
    : 'Rating not available here. In Live mode, enter an archive access key (Source → Archive) and pins will show ratings.';
  if(r && sample && sample.note){ const n = document.createElement('div'); n.style.cssText = 'color:#666;font-size:11px;margin:-4px 0 8px'; n.textContent = sample.note; el._note = n; }
  const pb = document.createElement('div'); pb.className = 'pb';
  const copy = document.createElement('button'); copy.textContent = 'Copy';
  copy.onclick = async () => { const t = `${pin.name}\n${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}\n${fmtMGA(pin.lat, pin.lng)}`;
    try { await navigator.clipboard.writeText(t); copy.textContent = 'Copied'; } catch(e){ prompt('Copy:', t); } };
  const gm = document.createElement('a'); gm.textContent = 'Maps'; gm.target = '_blank'; gm.rel = 'noopener';
  gm.href = `https://www.google.com/maps/search/?api=1&query=${pin.lat.toFixed(6)},${pin.lng.toFixed(6)}`;
  const del = document.createElement('button'); del.textContent = 'Delete';
  del.onclick = () => removePin(pin.id);
  pb.append(copy, gm, del); el.append(name, pc, fdr, pb);
  if(el._note) el.insertBefore(el._note, pb);
  L.DomEvent.disableClickPropagation(el);
  return el;
}
function drawPin(pin){
  const r = fdrAt(pin.lat, pin.lng);
  const m = L.marker([pin.lat, pin.lng], {draggable:true, icon:pinIcon(r && r[2]), title:pin.name, autoPan:true}).addTo(pinLayer);
  m.bindPopup(() => popupFor(pin), {minWidth:200});
  m.on('dragend', () => { const l = m.getLatLng(); pin.lat = l.lat; pin.lng = l.lng; savePins(); refreshPins(); m.openPopup(); });
  markers.set(pin.id, m);
}
function addPin(lat, lng, name, open = true){
  const pin = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: name || `Pin ${pins.length + 1}`, lat, lng};
  pins.push(pin); savePins(); drawPin(pin); listPins();
  if(open) markers.get(pin.id).openPopup();
  return pin;
}
function removePin(id){ pins = pins.filter(p => p.id !== id); savePins(); const m = markers.get(id); if(m){ pinLayer.removeLayer(m); markers.delete(id); } listPins(); }
function refreshPins(){
  if(typeof markers === 'undefined') return;
  for(const pin of pins){ const m = markers.get(pin.id); if(!m) continue;
    const r = fdrAt(pin.lat, pin.lng); m.setIcon(pinIcon(r && r[2]));
    if(m.isPopupOpen()) m.setPopupContent(popupFor(pin)); }
  listPins();
}
function listPins(){
  const el = $('pinlist'); el.innerHTML = '';
  if(!pins.length){ el.textContent = 'No pins yet — long-press the map or use 📍.'; return; }
  for(const pin of pins){
    const r = fdrAt(pin.lat, pin.lng), row = document.createElement('div'), sw = document.createElement('span'), t = document.createElement('span');
    sw.className = 'sw'; sw.style.background = (r && r[2]) || '#1a73e8';
    t.textContent = pin.name + (r && r[2] ? ` — ${r[0]}` : '');
    row.append(sw, t); row.onclick = () => { map.setView([pin.lat, pin.lng], Math.max(map.getZoom(), 11)); markers.get(pin.id).openPopup(); };
    el.append(row);
  }
}
$('clearpins').onclick = () => { if(!pins.length || !confirm(`Delete all ${pins.length} pins?`)) return; pinLayer.clearLayers(); markers.clear(); pins = []; savePins(); listPins(); };
pins.forEach(drawPin); listPins();

// Drop pins: 📍 then tap, or long-press / right-click anywhere
let pinMode = false;
const setPinMode = on => { pinMode = on; $('pinmode').classList.toggle('on', on); map.getContainer().style.cursor = on ? 'crosshair' : ''; };
$('pinmode').onclick = () => setPinMode(!pinMode);
map.on('click', e => { if(pinMode && !aligning){ addPin(e.latlng.lat, e.latlng.lng); setPinMode(false); } });
map.on('contextmenu', e => { if(!aligning) addPin(e.latlng.lat, e.latlng.lng); });

// Search: coordinates first, otherwise OpenStreetMap place search (biased to Tasmania)
const results = $('results');
function showResults(items){ results.innerHTML = '';
  for(const it of items){ const d = document.createElement('div'); d.textContent = it.label; if(it.go) d.onclick = it.go; else d.className = 'msg'; results.append(d); } }
async function search(){
  const s = $('q').value.trim(); results.innerHTML = ''; if(!s) return;
  const c = parseCoords(s);
  if(c){ map.setView([c.lat, c.lng], Math.max(map.getZoom(), 12)); addPin(c.lat, c.lng, s); return; }
  showResults([{label:'Searching…'}]);
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=au&viewbox=143.5,-39.2,148.6,-43.9&q=' + encodeURIComponent(s);
    const r = await fetch(url, {headers:{'Accept-Language':'en'}}); if(!r.ok) throw new Error(r.status);
    const hits = await r.json();
    if(!map._osmAttr){ map.attributionControl.addAttribution('Search © OpenStreetMap'); map._osmAttr = true; }
    if(!hits.length){ showResults([{label:'No places found. Try adding the town, or enter coordinates.'}]); return; }
    const pick = h => { results.innerHTML = ''; const lat = +h.lat, lng = +h.lon;
      map.setView([lat, lng], Math.max(map.getZoom(), 13)); addPin(lat, lng, h.display_name.split(',').slice(0, 2).join(',').trim()); };
    if(hits.length === 1) return pick(hits[0]);
    showResults(hits.map(h => ({label: h.display_name, go: () => pick(h)})));
  } catch(e){ showResults([{label:'Place search is unavailable right now — coordinates still work.'}]); }
}
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('q').blur(); search(); } if(e.key === 'Escape') results.innerHTML = ''; });
$('q').addEventListener('input', () => { if(!$('q').value) results.innerHTML = ''; });
[ $('searchbar'), results ].forEach(el => { L.DomEvent.disableClickPropagation(el); L.DomEvent.disableScrollPropagation(el); });

// My location
let locLayer = null;
$('locate').onclick = () => {
  if(!navigator.geolocation){ statusEl.textContent = 'Location isn’t available in this browser.'; return; }
  $('locate').classList.add('on');
  navigator.geolocation.getCurrentPosition(pos => {
    $('locate').classList.remove('on');
    const ll = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy;
    if(locLayer) map.removeLayer(locLayer);
    locLayer = L.layerGroup([L.circle(ll, {radius:acc, color:'#1a73e8', weight:1, fillOpacity:.1}),
                             L.circleMarker(ll, {radius:7, color:'#fff', weight:2, fillColor:'#1a73e8', fillOpacity:1})]).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 13));
    const r = fdrAt(ll[0], ll[1]);
    statusEl.innerHTML = '';
    statusEl.textContent = `You are here (±${Math.round(acc)} m)` + (r && r[2] ? ` — FDR ${r[0]} (${dayLabel()})` : '') + '. Long-press to pin it.';
  }, err => { $('locate').classList.remove('on'); statusEl.innerHTML = `<b style="color:#c8102e">Couldn’t get your location</b> (${err.message}).`; },
     {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
};

loadDay(0);
</script>
</body>
</html>
