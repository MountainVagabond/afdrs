<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tas Fire Danger Overlay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,sans-serif;background:#111}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;color:#222;padding:10px 12px;border-radius:8px;
         box-shadow:0 2px 10px rgba(0,0,0,.3);width:230px;max-width:calc(100vw - 52px);max-height:calc(100vh - 40px);overflow:auto}
  .panel h1{font-size:15px;margin:0 0 8px}
  .panel label{display:block;margin:8px 0 2px;font-weight:600;font-size:12px}
  .panel select,.panel input[type=range]{width:100%}
  .days{display:flex;gap:4px}.days button{flex:1;padding:5px 0;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer;font-size:12px}
  .days button.on{background:#c8102e;color:#fff;border-color:#c8102e}
  .legend{margin-top:8px;font-size:12px}.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
  .legend span{width:14px;height:14px;border:1px solid #999;display:inline-block}
  .small{font-size:11px;color:#666;margin-top:6px}
  .row{display:flex;gap:6px;margin-top:8px}.row button{flex:1;font-size:12px;padding:4px;cursor:pointer}
  .h{width:12px;height:12px;margin:-8px 0 0 -8px;border:2px solid #fff;box-shadow:0 0 3px #000;box-sizing:content-box}
  .h.blue{background:#0af;border-radius:50%}
  .h.orange{background:#f80;border-radius:3px}
  .h.big{width:28px;height:28px;margin:-17px 0 0 -17px;border-width:3px;opacity:.95}
  .h.big::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#000;border-radius:50%}
  .row button:disabled{opacity:.4}
  #toggle{display:none}
  #status:empty{display:none}
  @media (max-width:520px){
    #toggle{display:block;width:100%;padding:5px;font-size:13px;cursor:pointer}
    .panel.collapsed{padding:6px;width:200px}
    .panel.collapsed > :not(#toggle):not(#days):not(#status){display:none}
    .panel.collapsed #days{margin-top:6px}
    .panel.collapsed #status{margin-top:4px}
  }
  /* ---- search bar, pins ---- */
  #searchbar{position:absolute;z-index:1001;left:10px;bottom:26px;display:flex;gap:4px;background:#fff;padding:5px;border-radius:8px;
             box-shadow:0 2px 10px rgba(0,0,0,.3);width:min(400px,calc(100vw - 40px));box-sizing:border-box}
  #q{flex:1;min-width:0;font-size:16px;padding:5px 7px;border:1px solid #bbb;border-radius:4px}
  #searchbar button{font-size:16px;line-height:1;padding:4px 7px;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer}
  #searchbar button.on{background:#c8102e;border-color:#c8102e}
  #results{position:absolute;z-index:1001;left:10px;bottom:72px;width:min(400px,calc(100vw - 40px));box-sizing:border-box;background:#fff;
           border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-height:40vh;overflow:auto;font-size:13px}
  #results:empty{display:none}
  #results div{padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer}
  #results div:hover{background:#f4f4f4}
  #results .msg{cursor:default;color:#666}
  .pinicon{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #222;box-shadow:0 1px 4px rgba(0,0,0,.5);position:relative}
  .pinicon::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#222}
  .pinpop{min-width:190px;font-size:12px}
  .pinpop input{width:100%;box-sizing:border-box;font:600 13px system-ui,sans-serif;padding:3px 5px;border:1px solid #ccc;border-radius:4px}
  .pinpop .pc{margin:6px 0;color:#333;line-height:1.5}
  .pinpop .fdr{margin:4px 0 8px}.pinpop .fdr b{padding:1px 6px;border-radius:3px;border:1px solid #999}
  .pinpop .pb{display:flex;gap:4px}.pinpop .pb button,.pinpop .pb a{flex:1;font-size:12px;padding:4px;text-align:center;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;color:#222;text-decoration:none;cursor:pointer}
  #pinlist div{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;font-size:12px}
  #pinlist span.sw{width:10px;height:10px;border-radius:50%;border:1px solid #333;flex:none}
  /* ---- fire weather forecast sheet ---- */
  #fcsheet{position:absolute;z-index:1002;left:10px;bottom:72px;width:min(560px,calc(100vw - 20px));box-sizing:border-box;max-height:min(70vh,640px);
           overflow:auto;background:#fff;color:#222;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.4);font-size:12px}
  #fcsheet[hidden]{display:none}
  #fcsheet .fh{position:sticky;top:0;background:#fff;padding:8px 10px 6px;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:flex-start;z-index:1}
  #fcsheet .fh h2{font-size:14px;margin:0;line-height:1.25}
  #fcsheet .fh .sub{color:#555;font-size:11px;margin-top:2px}
  #fcsheet .fh button{margin-left:auto;flex:none;font-size:16px;line-height:1;padding:3px 8px;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;cursor:pointer}
  #fcsheet .fb{padding:6px 10px 10px}
  #fcsheet table{border-collapse:collapse;width:100%;table-layout:fixed}
  #fcsheet th,#fcsheet td{padding:4px 3px;border-bottom:1px solid #eee;text-align:center;vertical-align:middle;overflow-wrap:anywhere}
  #fcsheet th:first-child,#fcsheet td:first-child{text-align:left;width:31%;color:#444;font-weight:600}
  #fcsheet thead th{font-size:11px;color:#222;position:sticky;top:0}
  #fcsheet tr.grp td{background:#f3f3f3;color:#222;font-weight:700;text-align:left;padding-top:6px}
  #fcsheet .cur{background:#fff4e5}
  #fcsheet .rt{display:inline-block;padding:1px 3px;border-radius:3px;border:1px solid #999;font-weight:700;white-space:nowrap;font-size:11px}
  @media (max-width:420px){#fcsheet .rt{font-size:10px;letter-spacing:-.2px}#fcsheet{font-size:11.5px}}
  #fcsheet .fbi{display:inline-block;min-width:2.2em;padding:1px 4px;border-radius:3px;border:1px solid #999;font-weight:700}
  #fcsheet .red{color:#fff;background:#c8102e;border-radius:3px;padding:0 4px;font-weight:700}
  #fcsheet .txt{margin:8px 0 0;line-height:1.4}#fcsheet .txt b{display:inline-block;min-width:5.5em}
  #fcsheet .note{color:#666;font-size:11px;margin-top:8px;line-height:1.4}
  #fcsheet .acts{display:flex;gap:6px;margin-top:8px}#fcsheet .acts a,#fcsheet .acts button{flex:1;font-size:12px;padding:6px;text-align:center;border:1px solid #bbb;background:#f4f4f4;border-radius:4px;color:#222;text-decoration:none;cursor:pointer}
  .pinpop .fcbtn{width:100%;margin:0 0 6px;font-size:12px;padding:5px;border:1px solid #c8102e;background:#fff;color:#c8102e;border-radius:4px;cursor:pointer;font-weight:600}
  .fcdot{width:14px;height:14px;border-radius:50%;background:#c8102e;border:3px solid #fff;box-shadow:0 0 4px #000;box-sizing:border-box}
</style>
</head>
<body>
<div id="map"></div>
<div id="results"></div>
<div id="searchbar">
  <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Address, lat/long or MGA55 E N">
  <button id="go" title="Search">🔍</button>
  <button id="pinmode" title="Drop a pin: tap this, then tap the map (or long-press / right-click the map)">📍</button>
  <button id="locate" title="Show my location">🎯</button>
  <button id="fcmode" title="Fire weather forecast: tap this, then tap a place on the map">🌦</button>
</div>
<div id="fcsheet" hidden></div>
<div class="panel" id="panel">
  <h1>TFS Fire Danger Rating</h1>
  <button id="toggle">Show / hide controls</button>
  <label>Source</label>
  <select id="source">
    <option value="live">Live — fire.tas.gov.au (today)</option>
    <option value="archive">Archive — past days</option>
  </select>
  <div id="archiveBox" style="display:none">
    <label>Archive address (GitHub user/repo)</label>
    <input type="text" id="repo" placeholder="e.g. MountainVagabond/tfs-fdr-archive" style="width:100%;box-sizing:border-box;font-size:12px">
    <label>Access key (GitHub token, for a private archive)</label>
    <input type="password" id="token" placeholder="github_pat_… — remembered on this device" autocomplete="off" style="width:100%;box-sizing:border-box;font-size:12px">
    <label>Date issued</label>
    <select id="date"></select>
    <label>Issue time</label>
    <select id="run"></select>
  </div>
  <label>Forecast day</label>
  <div class="days" id="days">
    <button data-d="0" class="on">Today</button><button data-d="1">Tmrw</button><button data-d="2">Day 2</button><button data-d="3">Day 3</button>
  </div>
  <label>Overlay opacity <span id="opv">70%</span></label>
  <input type="range" id="op" min="0" max="100" value="70">
  <label>Basemap</label>
  <select id="base">
    <option value="satlab">Satellite + place names (Esri)</option>
    <option value="street">Streets (Esri)</option>
    <option value="carto">Streets (CARTO)</option>
    <option value="light">Light (CARTO)</option>
    <option value="topo">Topographic (Esri)</option>
    <option value="sat">Esri satellite</option>
  </select>
  <label>FDR coastline outline</label>
  <select id="outline">
    <option value="magenta">Magenta</option>
    <option value="cyan">Cyan</option>
    <option value="yellow">Yellow</option>
    <option value="red">Red</option>
    <option value="off">Off</option>
  </select>
  <div class="legend">
    <div><span style="background:#fff"></span>No rating</div>
    <div><span style="background:#64bf30"></span>Moderate</div>
    <div><span style="background:#ffe033"></span>High</div>
    <div><span style="background:#f58220"></span>Extreme</div>
    <div><span style="background:#b11a1a"></span>Catastrophic</div>
  </div>
  <label>Image projection</label>
  <select id="proj">
    <option value="tm">MGA zone 55 (fitted, best)</option>
    <option value="latlon">Lat/long grid (reprojected)</option>
    <option value="merc">As-is (no reprojection)</option>
  </select>
  <label>Control grid</label>
  <select id="grid">
    <option value="4">4 × 4 points (coarse)</option>
    <option value="6">6 × 6</option>
    <option value="8">8 × 8</option>
    <option value="12">12 × 12</option>
    <option value="16">16 × 16 (fine)</option>
  </select>
  <div class="row">
    <button id="align">Align overlay</button>
    <button id="undo">Undo</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row">
    <button id="exp">Copy alignment</button>
    <button id="imp">Paste alignment</button>
  </div>
  <label>Pins <button id="clearpins" style="float:right;font-size:11px;padding:1px 6px;cursor:pointer">Clear all</button></label>
  <div id="pinlist" class="small">No pins yet — long-press the map or use 📍.</div>
  <label>Load PNG from file</label>
  <input type="file" id="file" accept="image/png,image/*" style="width:100%;font-size:12px">
  <div class="small" id="status">Loading overlay…</div>
  <div class="small">Images: fire.tas.gov.au (refreshed morning and ~4:30pm). Not for safety decisions — check TFS directly.</div>
</div>

<script>
const LIVE = d => `https://www.fire.tas.gov.au/AFDRS/IDZ10136_AUS_AFDRS_max_fdr_SFC_Tas_Only_Day${d}.png?t=${new Date().toISOString().slice(0,13)}`;

const DEFAULT = [[-43.85, 143.30], [-39.35, 148.64]];
const OLD_KEY = 'tfsOverlayBounds', PKEY = 'tfsOverlayProj3', MKEY = 'tfsMesh3';
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = id => document.getElementById(id);
const statusEl = $('status');

/* ---------- Archive (GitHub repository filled by tfs_fdr_archive.py) ---------- */
const RKEY = 'tfsArchiveRepo', TKEY = 'tfsArchiveToken';
let source = 'live', index = null;          // index: {date: {"Day0.png": [filenames...], ...}}
const repoName = () => ($('repo').value || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
const repoBase = () => repoName() ? `https://api.github.com/repos/${repoName()}/contents/fdr_archive` : null;
// Read a file from the archive through GitHub's API (works for public repos, and private ones with a token)
async function ghFetch(url){
  // Keys are only letters, digits and _ ; anything else (spaces, invisible characters from a notes app or
  // password manager) would make the browser refuse to send the request at all, so strip it.
  const tok = cleanKey($('token').value), h = {Accept: 'application/vnd.github.raw+json'};
  if(tok) h.Authorization = 'Bearer ' + tok;
  let r;
  try { r = await fetch(url, {headers: h, cache: 'no-store'}); }
  catch(e){ throw new Error('net: ' + (e && e.message || e)); }
  if(!r.ok) throw new Error(r.status);
  return r;
}
const cleanKey = k => String(k || '').replace(/[^A-Za-z0-9_]/g, '');
const archiveError = code => code == 401 ? 'The access key was rejected — check it, or that it hasn’t expired.'
  : code == 404 ? 'Archive not found — check the user/repo address, and if the archive is private, that the access key is entered and allowed to read it.'
  : code == 403 ? 'GitHub refused the request (too many requests without a key, or the key lacks access).'
  : /^net:/.test(code) ? `Couldn’t reach GitHub — check the phone has signal, then try again. (${String(code).slice(5)})`
  : `Something went wrong reading the archive (${code}).`;
function archiveFile(d){
  // newest file for Day d whose issue stamp is not after the chosen issue time (unchanged images aren't re-saved)
  const date = $('date').value, run = $('run').value, list = index && index[date] && index[date][`Day${d}.png`] || [];
  const ok = list.filter(f => f.slice(0,15) <= run);
  return ok.length ? ok[ok.length-1] : null;
}
const SRC = d => {
  if(source === 'live') return LIVE(d);
  const f = archiveFile(d); return f ? `${repoBase()}/${$('date').value}/${f}` : null;
};
async function loadIndex(){
  const base = repoBase(); if(!base){ statusEl.textContent = 'Enter the archive address (GitHub user/repo).'; return; }
  statusEl.textContent = 'Reading archive index…';
  try {
    index = await (await ghFetch(`${base}/index.json`)).json();
  } catch(e){ statusEl.innerHTML = `<b style="color:#c8102e">Couldn’t read the archive.</b> ${archiveError(e.message)}`; index = null; return; }
  ls.set(RKEY, $('repo').value.trim()); ls.set(TKEY, $('token').value.trim());
  const dates = Object.keys(index).sort().reverse();
  $('date').innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
  fillRuns(); loadDay(day);
  if(typeof fcRefresh === 'function') fcRefresh();
}
function fillRuns(){
  const date = $('date').value, files = index && index[date] || {};
  const stamps = [...new Set(Object.values(files).flat().map(f => f.slice(0,15)))].sort();
  $('run').innerHTML = stamps.map(s => `<option value="${s}">${s.slice(11,13)}:${s.slice(13,15)}</option>`).join('');
  $('run').value = stamps[stamps.length-1] || '';
}
$('source').onchange = e => {
  source = e.target.value; $('archiveBox').style.display = source === 'archive' ? '' : 'none';
  if(source === 'archive'){ if(index) loadDay(day); else loadIndex(); } else loadDay(day);
};
$('repo').value = ls.get(RKEY) || 'MountainVagabond/tfs-fdr-archive';
$('token').value = ls.get(TKEY) || '';
$('repo').onchange = loadIndex;
$('token').onchange = () => { $('token').value = cleanKey($('token').value); loadIndex(); };
$('date').onchange = () => { fillRuns(); loadDay(day); };
$('run').onchange = () => loadDay(day);

const map = L.map('map', {zoomControl:true}).setView([-41.9, 146.6], 7);
const bases = {
  // CARTO / Esri tiles work from a local file; OpenStreetMap's own servers block pages opened from disk
  satlab: L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
  ]),
  street: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
  carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}),
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}),
  topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'})
};
let base = bases.satlab.addTo(map);
$('base').onchange = e => { map.removeLayer(base); base = bases[e.target.value].addTo(map); };

// ImageOverlay that shows a <canvas>
const CanvasOverlay = L.ImageOverlay.extend({
  _initImage(){
    const c = this._image = this._url;
    L.DomUtil.addClass(c, 'leaflet-image-layer');
    if (this._zoomAnimated) L.DomUtil.addClass(c, 'leaflet-zoom-animated');
    c.onselectstart = L.Util.falseFn; c.onmousemove = L.Util.falseFn;
    this._updateOpacity();
  }
});

/* ---------- Mesh: an n×n grid of control points pinned to the image ---------- */
const CRS = L.CRS.EPSG3857;
const P = ll => CRS.project(L.latLng(ll[0], ll[1]));          // [lat,lng] -> metres
const U = p => { const l = CRS.unproject(p); return [l.lat, l.lng]; };
const mercLat = (N, S, t) => { const m = l => Math.log(Math.tan(Math.PI/4 + l*Math.PI/360)); const y = m(N) + (m(S)-m(N))*t; return (2*Math.atan(Math.exp(y)) - Math.PI/2)*180/Math.PI; };

let proj = ls.get(PKEY) || 'tm';
$('proj').value = proj;
let mesh = ls.get(MKEY);   // {n, nodes:[[lat,lng]...]} row-major, row 0 = top of image

// Fitted against Esri's detailed coastline: the TFS PNG is a GDA94/2020 MGA zone 55 grid (ellipsoidal Transverse
// Mercator, 147°E, k0 0.9996) with square ~161 m pixels. Image edges in MGA metres, plus small local corrections.
const TMFIT = {E0:221912.1, E1:630057.3, N0:5619564.3, N1:5159273.7, W:2535, H:2857,
  // [u px, v px, east corr m, north corr m] — smooth local tweaks measured region by region
  c:[[317,348,200,-600],[2218,348,-200,-400],[317,1044,0,-800],[951,1044,400,400],[1584,1044,0,200],[2218,1044,-50,250],
     [951,1741,150,-200],[1584,1741,50,-100],[2218,1741,100,0],[951,2437,-50,0],[1584,2437,300,-50],[2218,2437,0,0]]};
const mgaInv = (() => {
  const a=6378137, f=1/298.257222101, n=f/(2-f), A=a/(1+n)*(1+n*n/4+n**4/64), k0=0.9996, R=Math.PI/180;
  const be=[n/2-2*n*n/3+37*n**3/96, n*n/48+n**3/15, 17*n**3/480], de=[2*n-2*n*n/3-2*n**3, 7*n*n/3-8*n**3/5, 56*n**3/15];
  return (E, N) => {
    const xi=(N-1e7)/(k0*A), et=(E-5e5)/(k0*A); let xp=xi, ep=et;
    for(let j=1;j<=3;j++){ xp-=be[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*et); ep-=be[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*et); }
    const chi=Math.asin(Math.sin(xp)/Math.cosh(ep)); let p=chi;
    for(let j=1;j<=3;j++) p+=de[j-1]*Math.sin(2*j*chi);
    return [p/R, 147+Math.atan(Math.sinh(ep)/Math.cos(xp))/R];
  };
})();
function meshTM(n){
  const T = TMFIT, nodes = [];
  const corr = (u,v) => { let s=0,e=0,m=0; for(const c of T.c){ const w=1/((u-c[0])**2+(v-c[1])**2+1e4); s+=w; e+=w*c[2]; m+=w*c[3]; } return [e/s, m/s]; };
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const u=i/(n-1)*T.W, v=j/(n-1)*T.H, d=corr(u, Math.min(v,2785));
    nodes.push(mgaInv(T.E0+(T.E1-T.E0)*u/T.W+d[0], T.N0-(T.N0-T.N1)*v/T.H+d[1]));
  }
  return {n, nodes};
}
function meshFromBounds(b, n, pr){
  if(pr === 'tm') return meshTM(n);
  const [[S,W],[N,E]] = b, nodes = [];
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const t = j/(n-1);
    nodes.push([pr === 'latlon' ? N - (N-S)*t : mercLat(N,S,t), W + (E-W)*i/(n-1)]);
  }
  return {n, nodes};
}
if(!mesh || !mesh.nodes) mesh = meshFromBounds(DEFAULT, 16, proj);
$('grid').value = String(mesh.n);
const saveMesh = () => ls.set(MKEY, mesh);

// Where image point (u,v in 0..1) lands, in projected metres (same triangles as the renderer)
function warpAt(m, u, v){
  const n = m.n, gx = Math.min(u*(n-1), n-1-1e-9), gy = Math.min(v*(n-1), n-1-1e-9);
  const i = Math.floor(gx), j = Math.floor(gy), fx = gx-i, fy = gy-j;
  const q = (a,b) => P(m.nodes[(j+b)*n + i+a]);
  const p00=q(0,0), p10=q(1,0), p01=q(0,1), p11=q(1,1);
  return fy <= fx
    ? L.point(p00.x + fx*(p10.x-p00.x) + fy*(p11.x-p10.x), p00.y + fx*(p10.y-p00.y) + fy*(p11.y-p10.y))
    : L.point(p00.x + fy*(p01.x-p00.x) + fx*(p11.x-p01.x), p00.y + fy*(p01.y-p00.y) + fx*(p11.y-p01.y));
}
function resample(n){
  const nodes = [];
  for(let j=0;j<n;j++) for(let i=0;i<n;i++) nodes.push(U(warpAt(mesh, i/(n-1), j/(n-1))));
  mesh = {n, nodes};
}
function triangles(m){
  const n = m.n, t = [];
  for(let j=0;j<n-1;j++) for(let i=0;i<n-1;i++){
    const a=j*n+i, b=a+1, c=a+n, d=c+1;
    t.push([a,b,d],[a,d,c]);
  }
  return t;
}

/* ---------- Rendering ---------- */
let box = null, imgLayer = null, srcImg = null, srcBlend = false, opacity = .7, day = 0;
function render(){
  if(!srcImg) return;
  const sw = srcImg.naturalWidth || srcImg.width, sh = srcImg.naturalHeight || srcImg.height, n = mesh.n;
  const pts = mesh.nodes.map(P);
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const scale = Math.min(3000/(maxX-minX), 3000/(maxY-minY), sw*1.1/(maxX-minX));
  const out = document.createElement('canvas');
  out.width = Math.ceil((maxX-minX)*scale); out.height = Math.ceil((maxY-minY)*scale);
  const x = out.getContext('2d');
  const D = pts.map(p => [(p.x-minX)*scale, (maxY-p.y)*scale]);                 // canvas y down = north up
  const S = mesh.nodes.map((_,k) => [(k % n)/(n-1)*sw, Math.floor(k/n)/(n-1)*sh]);
  for(const [a,b,c] of triangles(mesh)){
    const [x0,y0]=S[a],[x1,y1]=S[b],[x2,y2]=S[c],[u0,v0]=D[a],[u1,v1]=D[b],[u2,v2]=D[c];
    const den = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0); if(!den) continue;
    const A = ((u1-u0)*(y2-y0) - (u2-u0)*(y1-y0))/den, C = ((u2-u0)*(x1-x0) - (u1-u0)*(x2-x0))/den;
    const B = ((v1-v0)*(y2-y0) - (v2-v0)*(y1-y0))/den, Dd = ((v2-v0)*(x1-x0) - (v1-v0)*(x2-x0))/den;
    const cx=(u0+u1+u2)/3, cy=(v0+v1+v2)/3, grow = p => { const dx=p[0]-cx, dy=p[1]-cy, l=Math.hypot(dx,dy)||1; return [p[0]+dx/l*.8, p[1]+dy/l*.8]; };
    const t = [grow([u0,v0]),grow([u1,v1]),grow([u2,v2])];
    x.save(); x.beginPath(); x.moveTo(...t[0]); x.lineTo(...t[1]); x.lineTo(...t[2]); x.closePath(); x.clip();
    x.setTransform(A, B, C, Dd, u0 - A*x0 - C*y0, v0 - B*x0 - Dd*y0);
    x.drawImage(srcImg, 0, 0);
    x.restore();
  }
  box = {minX,minY,maxX,maxY};
  const bounds = L.latLngBounds(U(L.point(minX,minY)), U(L.point(maxX,maxY)));
  if(imgLayer) map.removeLayer(imgLayer);
  imgLayer = new CanvasOverlay(out, bounds, {opacity, interactive:false}).addTo(map);
  map.getPane('overlayPane').style.mixBlendMode = srcBlend ? 'multiply' : '';
}

const OUTLINE = {magenta:[255,0,255], cyan:[0,255,255], yellow:[255,255,0], red:[255,0,0]};
let rawImg = null;
function keyed(img){
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img,0,0);
  const id = x.getImageData(0,0,W,H), p = id.data;   // throws if cross-origin
  // sea = flat mid-grey (≈225); land = white "no rating" or a rating colour
  const sea = new Uint8Array(W*H);
  for(let k=0;k<W*H;k++){ const r=p[k*4],g=p[k*4+1],b=p[k*4+2]; sea[k] = (Math.abs(r-g)<8 && Math.abs(g-b)<8 && r>150 && r<240) ? 1 : 0; }
  for(let k=0;k<W*H;k++){
    const i=k*4, r=p[i],g=p[i+1],b=p[i+2];
    if(Math.abs(r-g)<12 && Math.abs(g-b)<12 && Math.abs(r-b)<12) p[i+3] = r>200 ? 0 : 120;
  }
  const col = OUTLINE[$('outline').value];
  if(col){
    // land pixels touching sea (2 px thick) get the outline colour
    for(let y=0;y<H;y++) for(let X=0;X<W;X++){
      const k=y*W+X; if(sea[k]) continue;
      let edge=false;
      for(let dy=-2;dy<=2 && !edge;dy++) for(let dx=-2;dx<=2;dx++){
        const yy=y+dy, xx=X+dx; if(yy<0||yy>=H||xx<0||xx>=W) continue;
        if(sea[yy*W+xx]){ edge=true; break; }
      }
      if(edge){ const i=k*4; p[i]=col[0]; p[i+1]=col[1]; p[i+2]=col[2]; p[i+3]=255; }
    }
  }
  x.putImageData(id,0,0); return c;
}
function useImage(img, msg){
  rawImg = img;
  try { srcImg = keyed(img); srcBlend = false; } catch(e){ srcImg = img; srcBlend = true; }
  render();
  statusEl.textContent = msg;
  if (typeof setSampleFor === 'function') setSampleFor(img, !srcBlend);
}
function loadDay(d){
  statusEl.textContent = 'Loading…';
  const url = SRC(d), img = new Image();
  if(!url){ statusEl.textContent = source === 'archive' && index ? `No Day ${d} image archived for ${$('date').value}.` : 'Enter the archive address (GitHub user/repo).'; return; }
  const label = source === 'archive' ? `Archive: issued ${$('date').value} ${$('run').options[$('run').selectedIndex]?.text || ''}, Day ${d}.` : 'Live overlay loaded.';
  if(source === 'archive'){
    // fetched as a blob, so the image counts as same-origin and the coastline outline works
    ghFetch(url).then(r => r.blob()).then(b => {
      img.onload = () => { useImage(img, label); URL.revokeObjectURL(img.src); };
      img.onerror = () => { statusEl.innerHTML = '<b style="color:#c8102e">That archive file isn’t a readable image.</b>'; };
      img.src = URL.createObjectURL(b);
    }).catch(e => { statusEl.innerHTML = `<b style="color:#c8102e">Couldn’t load that image from the archive.</b> ${archiveError(e.message)}`; });
    return;
  }
  img.crossOrigin = 'anonymous';
  img.onload = () => useImage(img, label);
  img.onerror = () => {
    const plain = new Image();
    plain.onload = () => useImage(plain, 'Overlay loaded.');
    plain.onerror = () => { statusEl.innerHTML = '<b style="color:#c8102e">Couldn’t load the map image from the TFS website.</b> Use “Load PNG from file” instead.'; };
    plain.src = url.replace(/\?.*/,'') + '?t=' + Date.now();
  };
  img.src = url;
}
function loadLocal(file){
  if(!file) return;
  const img = new Image();
  img.onload = () => useImage(img, 'Loaded ' + file.name + '.');
  img.onerror = () => { statusEl.textContent = 'That file isn’t a readable image.'; };
  img.src = URL.createObjectURL(file);
}
$('outline').onchange = () => { if(rawImg){ try{ srcImg = keyed(rawImg); srcBlend = false; render(); }catch(e){} } };
$('file').onchange = e => loadLocal(e.target.files[0]);
$('map').addEventListener('dragover', e => e.preventDefault());
$('map').addEventListener('drop', e => { e.preventDefault(); loadLocal(e.dataTransfer.files[0]); });

$('days').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  day = +b.dataset.d; loadDay(day);
};
$('op').oninput = () => { opacity = $('op').value/100; $('opv').textContent = $('op').value+'%'; imgLayer && imgLayer.setOpacity(opacity); };

/* ---------- Alignment handles ---------- */
let aligning = false, layer = L.layerGroup(), undo = [];
const icon = cls => L.divIcon({className:'h ' + cls, iconSize:null});
const snapshot = () => { undo.push(JSON.stringify(mesh)); if(undo.length > 50) undo.shift(); };
function commit(){ saveMesh(); render(); drawHandles(); }

// Move everything by a projected-metre delta
function translateAll(from, d){
  if(imgLayer && box) imgLayer.setBounds(L.latLngBounds(U(L.point(box.minX+d.x, box.minY+d.y)), U(L.point(box.maxX+d.x, box.maxY+d.y)))); mesh.nodes = from.map(ll => { const p = P(ll); return U(L.point(p.x+d.x, p.y+d.y)); }); }

function wireframe(){
  const n = mesh.n, lines = [];
  for(let j=0;j<n;j++) lines.push(mesh.nodes.slice(j*n, j*n+n));
  for(let i=0;i<n;i++){ const c=[]; for(let j=0;j<n;j++) c.push(mesh.nodes[j*n+i]); lines.push(c); }
  return lines;
}
let wire = null;
const updateWire = () => wire && wire.setLatLngs(wireframe());

function drawHandles(){
  layer.clearLayers(); if(!aligning) return;
  const n = mesh.n;
  wire = L.polyline(wireframe(), {color:'#0af', weight:1, opacity:.6, interactive:false}).addTo(layer);
  // Blue: each mesh node — drag to bend the image locally
  mesh.nodes.forEach((ll, k) => {
    const m = L.marker(ll, {draggable:true, icon:icon('blue')}).addTo(layer);
    m.on('dragstart', snapshot);
    m.on('drag', () => { const p = m.getLatLng(); mesh.nodes[k] = [p.lat, p.lng]; updateWire(); });
    m.on('dragend', commit);
  });
  // Orange: centre of every cell — drag to move the whole overlay
  for(let j=0;j<n-1;j++) for(let i=0;i<n-1;i++){
    const c = U(warpAt(mesh, (i+.5)/(n-1), (j+.5)/(n-1)));
    const m = L.marker(c, {draggable:true, icon:icon('orange')}).addTo(layer);
    let from, p0;
    m.on('dragstart', () => { snapshot(); from = mesh.nodes.slice(); p0 = P(c); });
    m.on('drag', () => { const p = P([m.getLatLng().lat, m.getLatLng().lng]); translateAll(from, L.point(p.x-p0.x, p.y-p0.y)); updateWire(); });
    m.on('dragend', commit);
  }
  placeFloating();
}

// Floating handles that always sit in the middle of the screen
const fMove = L.marker([0,0], {draggable:true, icon:icon('orange big'), zIndexOffset:1000});
const fWarp = L.marker([0,0], {draggable:true, icon:icon('blue big'), zIndexOffset:1000});
let dragging = false;
function placeFloating(){
  if(!aligning || dragging) return;
  const c = map.getCenter(), pc = map.latLngToContainerPoint(c);
  fMove.setLatLng(map.containerPointToLatLng(pc.add([-30,0]))).addTo(map);
  fWarp.setLatLng(map.containerPointToLatLng(pc.add([30,0]))).addTo(map);
}
map.on('moveend', placeFloating);
{ let from, p0;
  fMove.on('dragstart', () => { dragging = true; snapshot(); from = mesh.nodes.slice(); const l = fMove.getLatLng(); p0 = P([l.lat,l.lng]); });
  fMove.on('drag', () => { const l = fMove.getLatLng(), p = P([l.lat,l.lng]); translateAll(from, L.point(p.x-p0.x, p.y-p0.y)); updateWire(); });
  fMove.on('dragend', () => { dragging = false; commit(); });
}
// Blue floating: bends the image right here — moves the 3 surrounding mesh points just enough
{ let from, p0, tri = null;
  function findTri(p){
    const pts = mesh.nodes.map(P);
    for(const t of triangles(mesh)){
      const [a,b,c] = t.map(k=>pts[k]);
      const den = (b.y-c.y)*(a.x-c.x) + (c.x-b.x)*(a.y-c.y);
      const w1 = ((b.y-c.y)*(p.x-c.x) + (c.x-b.x)*(p.y-c.y))/den, w2 = ((c.y-a.y)*(p.x-c.x) + (a.x-c.x)*(p.y-c.y))/den, w3 = 1-w1-w2;
      if(w1>=-1e-9 && w2>=-1e-9 && w3>=-1e-9) return {k:t, w:[w1,w2,w3]};
    }
    return null;
  }
  fWarp.on('dragstart', () => {
    dragging = true; const l = fWarp.getLatLng(); p0 = P([l.lat,l.lng]); tri = findTri(p0);
    if(!tri){ statusEl.textContent = 'Blue handle is outside the overlay — move it over the image.'; return; }
    snapshot(); from = mesh.nodes.slice();
  });
  fWarp.on('drag', () => {
    if(!tri) return;
    const l = fWarp.getLatLng(), p = P([l.lat,l.lng]), dx = p.x-p0.x, dy = p.y-p0.y;
    const ss = tri.w.reduce((s,w)=>s+w*w, 0);
    mesh.nodes = from.slice();
    tri.k.forEach((k, idx) => { const q = P(from[k]), f = tri.w[idx]/ss; mesh.nodes[k] = U(L.point(q.x + dx*f, q.y + dy*f)); });
    updateWire();
  });
  fWarp.on('dragend', () => { dragging = false; if(tri) commit(); else placeFloating(); });
}

function setAligning(on){
  aligning = on;
  $('align').textContent = on ? 'Done aligning' : 'Align overlay';
  if(on){ layer.addTo(map); drawHandles(); statusEl.textContent = 'Orange = move all · Blue = bend here. Big pair follows the screen centre.'; }
  else { layer.remove(); fMove.remove(); fWarp.remove(); saveMesh(); statusEl.textContent = 'Alignment saved.'; }
}
$('align').onclick = () => setAligning(!aligning);
$('undo').onclick = () => { if(!undo.length) return; mesh = JSON.parse(undo.pop()); $('grid').value = String(mesh.n); commit(); };

$('toggle').onclick = () => setCollapsed(!$('panel').classList.contains('collapsed'));

/* ---------- Scripting hooks (for Claude in Chrome or the browser console) ----------
   overlay.moveAll(dLat, dLng)            shift everything (degrees)
   overlay.bendAt(lat, lng, dLat, dLng)   move the image point at lat,lng by dLat,dLng; nearby only
   overlay.getMesh() / overlay.setMesh(m) read / replace all control points
   overlay.undo()                          step back                                         */
function bendAt(lat, lng, dLat, dLng){
  const p0 = P([lat,lng]), p1 = P([lat+dLat, lng+dLng]), dx = p1.x-p0.x, dy = p1.y-p0.y;
  const pts = mesh.nodes.map(P);
  for(const t of triangles(mesh)){
    const [a,b,c] = t.map(k=>pts[k]);
    const den = (b.y-c.y)*(a.x-c.x) + (c.x-b.x)*(a.y-c.y);
    const w1 = ((b.y-c.y)*(p0.x-c.x) + (c.x-b.x)*(p0.y-c.y))/den, w2 = ((c.y-a.y)*(p0.x-c.x) + (a.x-c.x)*(p0.y-c.y))/den, w3 = 1-w1-w2;
    if(w1>=-1e-9 && w2>=-1e-9 && w3>=-1e-9){
      const w = [w1,w2,w3], ss = w1*w1+w2*w2+w3*w3;
      snapshot();
      t.forEach((k,i) => { const q = pts[k]; mesh.nodes[k] = U(L.point(q.x + dx*w[i]/ss, q.y + dy*w[i]/ss)); });
      commit(); return true;
    }
  }
  return false;   // point not on the overlay
}
window.overlay = {
  moveAll(dLat, dLng){ snapshot(); mesh.nodes = mesh.nodes.map(([a,b]) => [a+dLat, b+dLng]); commit(); },

  getMesh: () => JSON.parse(JSON.stringify(mesh)),
  setMesh(m){ snapshot(); mesh = m; $('grid').value = String(m.n); commit(); },
  undo: () => $('undo').click()
};

/* ---------- Search, pins and location ---------- */
// MGA zone 55 (GDA2020/GDA94, GRS80): lat/long -> easting/northing (Krüger series, sub-mm accuracy)
const mgaFwd = (() => {
  const a=6378137, f=1/298.257222101, n=f/(2-f), A=a/(1+n)*(1+n*n/4+n**4/64), k0=0.9996, e=Math.sqrt(f*(2-f)), R=Math.PI/180;
  const al=[n/2-2*n*n/3+5*n**3/16, 13*n*n/48-3*n**3/5, 61*n**3/240];
  return (lat, lon) => {
    const ph=lat*R, dl=(lon-147)*R, t=Math.sinh(Math.atanh(Math.sin(ph)) - e*Math.atanh(e*Math.sin(ph)));
    const xp=Math.atan2(t, Math.cos(dl)), ep=Math.atanh(Math.sin(dl)/Math.sqrt(1+t*t));
    let xi=xp, et=ep;
    for(let j=1;j<=3;j++){ xi+=al[j-1]*Math.sin(2*j*xp)*Math.cosh(2*j*ep); et+=al[j-1]*Math.cos(2*j*xp)*Math.sinh(2*j*ep); }
    return [5e5 + k0*A*et, 1e7 + k0*A*xi];
  };
})();
const fmtMGA = (lat, lng) => { const [E,N] = mgaFwd(lat,lng); return `MGA55 E ${Math.round(E)} N ${Math.round(N)}`; };

// "-42.88, 147.33" · "42.88S 147.33E" · "147.33 -42.88" · "525000 5250000" · "55G 525000E 5250000N" -> {lat,lng} or null
function parseCoords(s){
  const nums = (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
  if(nums.length === 3 && (nums[0] === 54 || nums[0] === 55)) nums.shift();      // MGA zone prefix
  if(nums.length !== 2) return null;
  let [a, b] = nums;
  const ok = (la, lo) => la <= -9 && la >= -45 && lo >= 112 && lo <= 155;
  if(Math.abs(a) <= 180 && Math.abs(b) <= 180){                                    // degrees
    if(/s/i.test(s) && a > 0 && b > 0){ if(a < 90 && (b > 90 || a < b)) a = -a; else b = -b; }
    if(ok(a, b)) return {lat:a, lng:b};
    if(ok(b, a)) return {lat:b, lng:a};
    if(ok(-Math.abs(a), b)) return {lat:-Math.abs(a), lng:b};                     // latitude typed without the minus
    if(ok(-Math.abs(b), a)) return {lat:-Math.abs(b), lng:a};
    return null;
  }
  let E = a, N = b; if(a > 1e6 && b < 1e6){ E = b; N = a; }                        // MGA metres, either order
  if(E < 1e5 || E > 9e5 || N < 5e6 || N > 1e7) return null;
  const [la, lo] = mgaInv(E, N); return ok(la, lo) ? {lat:la, lng:lo} : null;
}

// Fire Danger Rating under a point, read from the overlay's source image (null if it can't be read)
const FDR = [['No rating',[255,255,255],'#ffffff'],['Moderate',[100,191,48],'#64bf30'],['High',[255,224,51],'#ffe033'],
             ['Extreme',[245,130,32],'#f58220'],['Catastrophic',[177,26,26],'#b11a1a'],[null,[225,225,225],null]];   // last = sea / outside / boundary line
const sampleCanvas = document.createElement('canvas'); sampleCanvas.width = sampleCanvas.height = 3;
function fdrAt(lat, lng){
  const img = sample && sample.img;
  if(!img || !mesh) return null;
  const p = P([lat,lng]), pts = mesh.nodes.map(P), n = mesh.n;
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
  const S = k => [(k % n)/(n-1)*sw, Math.floor(k/n)/(n-1)*sh];
  for(const t of triangles(mesh)){
    const [A,B,C] = t.map(k => pts[k]);
    const den = (B.y-C.y)*(A.x-C.x) + (C.x-B.x)*(A.y-C.y);
    const w1 = ((B.y-C.y)*(p.x-C.x) + (C.x-B.x)*(p.y-C.y))/den, w2 = ((C.y-A.y)*(p.x-C.x) + (A.x-C.x)*(p.y-C.y))/den, w3 = 1-w1-w2;
    if(w1 < -1e-9 || w2 < -1e-9 || w3 < -1e-9) continue;
    const [s0,s1,s2] = t.map(S), x = w1*s0[0]+w2*s1[0]+w3*s2[0], y = w1*s0[1]+w2*s1[1]+w3*s2[1];
    let d;
    try { const c = sampleCanvas.getContext('2d', {willReadFrequently:true}); c.clearRect(0,0,3,3);
          c.drawImage(img, Math.round(x)-1, Math.round(y)-1, 3, 3, 0, 0, 3, 3); d = c.getImageData(0,0,3,3).data; }
    catch(e){ return null; }                                                       // image from another site without permission
    const cls = i => { let best = 0, bd = Infinity; FDR.forEach((f, k) => { const dd = (d[i]-f[1][0])**2 + (d[i+1]-f[1][1])**2 + (d[i+2]-f[1][2])**2; if(dd < bd){ bd = dd; best = k; } }); return best; };
    const centre = cls(16);                                                        // pixel (1,1)
    if(FDR[centre][0]) return FDR[centre];
    const counts = {}; for(let i = 0; i < 36; i += 4){ const k = cls(i); if(FDR[k][0]) counts[k] = (counts[k] || 0) + 1; }
    const k = Object.keys(counts).sort((u, v) => counts[v] - counts[u])[0];
    return k !== undefined ? FDR[k] : ['Outside forecast area', null, null];
  }
  return ['Outside forecast area', null, null];
}
// Where ratings are read from: the overlay image if the browser lets us read it, otherwise (Live mode)
// the archive's newest copy of the same day's map, fetched with the access key.
let sample = null, borrowing = false, borrowSeq = 0, borrowIdx = {t:0, data:null};
function setSampleFor(img, readable){
  borrowSeq++; borrowing = false;
  sample = readable ? {img, note:''} : null;
  refreshPins();
  if(!readable && source === 'live') borrowSample(day);
}
async function borrowSample(d){
  const base = repoBase(); if(!base) return;
  const seq = ++borrowSeq; borrowing = true; refreshPins();
  try {
    if(!borrowIdx.data || Date.now() - borrowIdx.t > 10*60*1000)
      borrowIdx = {t: Date.now(), data: await (await ghFetch(`${base}/index.json`)).json()};
    const idx = borrowIdx.data;
    for(const date of Object.keys(idx).sort().reverse()){
      const list = idx[date][`Day${d}.png`]; if(!list || !list.length) continue;
      const file = list[list.length-1], blob = await (await ghFetch(`${base}/${date}/${file}`)).blob();
      const img = new Image(); img.src = URL.createObjectURL(blob); await img.decode();
      if(seq !== borrowSeq) return;                                   // day or source changed meanwhile
      sample = {img, note:`Rating from the archive copy captured ${date} ${file.slice(11,13)}:${file.slice(13,15)}.`};
      break;
    }
  } catch(e){ /* no key, no network or not allowed: pins stay unrated */ }
  if(seq === borrowSeq){ borrowing = false; refreshPins(); }
}
const dayLabel = () => { const b = $('days').querySelector('.on'); const t = b ? b.textContent : 'Today';
  return source === 'archive' && $('date').value ? `${t}, issued ${$('date').value}` : t; };

// Pins (remembered in this browser)
const PINKEY = 'tfsPins';

const markers = new Map(), pinLayer = L.layerGroup().addTo(map);
const savePins = () => ls.set(PINKEY, pins);
const pinIcon = col => L.divIcon({className:'', html:`<div class="pinicon" style="background:${col || '#1a73e8'}"></div>`,

function popupFor(pin){

  else if(r) fdr.textContent = `FDR (${dayLabel()}): ${r[0]}`;

  if(r && sample && sample.note){ const n = document.createElement('div'); n.style.cssText = 'color:#666;font-size:11px;margin:-4px 0 8px'; n.textContent = sample.note; el._note = n; }
  const pb = document.createElement('div'); pb.className = 'pb';

}
function drawPin(pin){
  const r = fdrAt(pin.lat, pin.lng);
  const m = L.marker([pin.lat, pin.lng], {draggable:true, icon:pinIcon(r && r[2]), title:pin.name, autoPan:true}).addTo(pinLayer);
  m.bindPopup(() => popupFor(pin), {minWidth:200});
  m.on('dragend', () => { const l = m.getLatLng(); pin.lat = l.lat; pin.lng = l.lng; savePins(); refreshPins(); m.openPopup(); });
  markers.set(pin.id, m);
}
function addPin(lat, lng, name, open = true){
  const pin = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: name || `Pin ${pins.length + 1}`, lat, lng};
  pins.push(pin); savePins(); drawPin(pin); listPins();
  if(open) markers.get(pin.id).openPopup();
  return pin;
}
function removePin(id){ pins = pins.filter(p => p.id !== id); savePins(); const m = markers.get(id); if(m){ pinLayer.removeLayer(m); markers.delete(id); } listPins(); }
function refreshPins(){
  if(typeof markers === 'undefined') return;
  for(const pin of pins){ const m = markers.get(pin.id); if(!m) continue;
    const r = fdrAt(pin.lat, pin.lng); m.setIcon(pinIcon(r && r[2]));
    if(m.isPopupOpen()) m.setPopupContent(popupFor(pin)); }
  listPins();
}
function listPins(){
  const el = $('pinlist'); el.innerHTML = '';
  if(!pins.length){ el.textContent = 'No pins yet — long-press the map or use 📍.'; return; }
  for(const pin of pins){
    const r = fdrAt(pin.lat, pin.lng), row = document.createElement('div'), sw = document.createElement('span'), t = document.createElement('span');
    sw.className = 'sw'; sw.style.background = (r && r[2]) || '#1a73e8';
    t.textContent = pin.name + (r && r[2] ? ` — ${r[0]}` : '');
    row.append(sw, t); row.onclick = () => { map.setView([pin.lat, pin.lng], Math.max(map.getZoom(), 11)); markers.get(pin.id).openPopup(); };
    el.append(row);
  }
}
$('clearpins').onclick = () => { if(!pins.length || !confirm(`Delete all ${pins.length} pins?`)) return; pinLayer.clearLayers(); markers.clear(); pins = []; savePins(); listPins(); };
pins.forEach(drawPin); listPins();

// Search: coordinates first, otherwise OpenStreetMap place search (biased to Tasmania)
const results = $('results');
function showResults(items){ results.innerHTML = '';
  for(const it of items){ const d = document.createElement('div'); d.textContent = it.label; if(it.go) d.onclick = it.go; else d.className = 'msg'; results.append(d); } }
async function search(){
  const s = $('q').value.trim(); results.innerHTML = ''; if(!s) return;
  const c = parseCoords(s);
  if(c){ map.setView([c.lat, c.lng], Math.max(map.getZoom(), 12)); addPin(c.lat, c.lng, s); return; }
  showResults([{label:'Searching…'}]);
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=au&viewbox=143.5,-39.2,148.6,-43.9&q=' + encodeURIComponent(s);
    const r = await fetch(url, {headers:{'Accept-Language':'en'}}); if(!r.ok) throw new Error(r.status);
    const hits = await r.json();

    if(!hits.length){ showResults([{label:'No places found. Try adding the town, or enter coordinates.'}]); return; }
    const pick = h => { results.innerHTML = ''; const lat = +h.lat, lng = +h.lon;
      map.setView([lat, lng], Math.max(map.getZoom(), 13)); addPin(lat, lng, h.display_name.split(',').slice(0, 2).join(',').trim()); };
    if(hits.length === 1) return pick(hits[0]);
    showResults(hits.map(h => ({label: h.display_name, go: () => pick(h)})));
  } catch(e){ showResults([{label:'Place search is unavailable right now — coordinates still work.'}]); }
}

/* ---------- Fire weather forecast at a point (4 days) ----------
   The collector saves TFS's Day 0-3 detailed fire weather forecast pages as JSON (fwf_latest.json and
   <date>/<stamp>_fwf.json) plus district and council boundaries (boundaries.json). Tap 🌦 then the map,
   or "4-day fire weather forecast" in a pin, to see the forecast for the district and council there.
   TFS's pages can't be read from another site, so this needs the archive access key.               */
let fcMode = false, fcMarker = null, fcBounds = null, fcCache = {}, fcLast = null;
const setFcMode = on => { fcMode = on; $('fcmode').classList.toggle('on', on); if(on) setPinMode(false);
  map.getContainer().style.cursor = on ? 'crosshair' : ''; if(on) statusEl.textContent = 'Tap a place on the map for its 4-day fire weather forecast.'; };
$('fcmode').onclick = () => setFcMode(!fcMode);
const fcSheet = $('fcsheet');
L.DomEvent.disableClickPropagation(fcSheet); L.DomEvent.disableScrollPropagation(fcSheet);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normName = n => String(n || '').replace(/\(tas\.?\)/ig, '').replace(/\bcity\b/ig, '').toLowerCase().replace(/[^a-z]/g, '');

function inRing(x, y, r){ let c = false; for(let i = 0, j = r.length-1; i < r.length; j = i++){
  const [xi, yi] = r[i], [xj, yj] = r[j]; if((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) c = !c; } return c; }
const inFeature = (f, lng, lat) => f.polys.some(poly => { let c = false; for(const r of poly) if(inRing(lng, lat, r)) c = !c; return c; });
function nearest(list, lng, lat, maxKm){
  let best = null, bd = Infinity; const kx = Math.cos(lat*Math.PI/180);
  for(const f of list) for(const poly of f.polys) for(const r of poly) for(const [x, y] of r){
    const d = Math.hypot((x-lng)*kx, y-lat)*111.2; if(d < bd){ bd = d; best = f; } }
  return bd <= maxKm ? {f: best, km: bd} : null;
}
function locate(list, lat, lng, maxKm){
  if(!list) return null;
  const f = list.find(f => inFeature(f, lng, lat)); if(f) return {f, km: 0};
  return nearest(list, lng, lat, maxKm);
}

// Which forecast file: Live = newest captured; Archive = newest captured on the chosen date, not after the chosen issue time
function fcFile(){
  if(source !== 'archive') return 'fwf_latest.json';
  const date = $('date').value, run = $('run').value, list = (index && index[date] && index[date]['fwf.json'] || []).filter(f => f.slice(0,15) <= run);
  return list.length ? `${date}/${list[list.length-1]}` : null;
}
async function fcLoad(path){
  const base = repoBase(); if(!base) throw new Error('nokey');
  const key = repoName() + '/' + path, hit = fcCache[key];
  if(hit && (path !== 'fwf_latest.json' || Date.now() - hit.t < 10*60*1000)) return hit.data;
  const r = await ghFetch(`${base}/${path}`);
  let data; try { data = await r.json(); } catch(e){ throw new Error(`the file ${path} didn’t read correctly`); }
  fcCache[key] = {t: Date.now(), data}; return data;
}

const RCOL = {'no rating':'#ffffff', 'moderate':'#64bf30', 'high':'#ffe033', 'extreme':'#f58220', 'catastrophic':'#b11a1a'};
const rateHTML = (r, fbi) => { if(!r && fbi == null) return '–'; const c = RCOL[String(r || '').toLowerCase()];
  return `${r ? `<span class="rt" style="background:${c || '#eee'};color:${/catas/i.test(r) ? '#fff' : '#222'}">${esc(r)}</span>` : ''}${fbi != null && fbi !== '' ? `<br>FBI ${fbiChip(fbi)}` : ''}`; };
// Any FBI number, coloured by its AFDRS band: 0–11 white, 12–23 green, 24–49 yellow, 50–99 orange, 100+ dark red
const fbiBand = v => { v = +v; return !isFinite(v) ? null : v >= 100 ? 'catastrophic' : v >= 50 ? 'extreme' : v >= 24 ? 'high' : v >= 12 ? 'moderate' : 'no rating'; };
const fbiChip = (v, title) => { const b = fbiBand(v); if(v == null || v === '' || !b) return esc(v ?? '–');
  return `<span class="fbi" style="background:${RCOL[b]};color:${b === 'catastrophic' ? '#fff' : '#222'}"${title ? ` title="${esc(title)}"` : ''}>${esc(v)}</span>`; };
const shortDate = (iso, txt) => { if(!iso) return esc(txt || ''); const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-AU', {weekday:'short'}) + '<br>' + d.getDate() + ' ' + d.toLocaleDateString('en-AU', {month:'short'}); };
const flag = (v, red) => red ? `<span class="red" title="Over the weather alert threshold">${esc(v)}</span>` : esc(v ?? '–');

function fcRender(lat, lng, name, data, dist, lga){
  const days = (data.days || []).slice().sort((a, b) => a.day - b.day);
  const dn = dist && dist.f.name, ln = lga && lga.f.name;
  const D = days.map(d => (d.districts || {})[dn] || null);
  const subFor = d => { for(const k of Object.keys(d.districts || {})){ const s = (d.districts[k].subs || []).find(s => normName(s.name) === normName(ln)); if(s) return {s, k}; } return null; };
  const S = ln ? days.map(subFor) : days.map(() => null);
  const subName = (S.find(x => x) || {}).s?.name;
  const curCol = source === 'archive' ? -1 : day;                                    // Live: highlight the day shown on the map
  const td = (fn, i) => `<td${days[i] && days[i].day === curCol ? ' class="cur"' : ''}>${fn(i)}</td>`;
  const row = (label, fn) => `<tr><td>${label}</td>${days.map((_, i) => td(fn, i)).join('')}</tr>`;
  const grp = t => `<tr class="grp"><td colspan="${days.length + 1}">${t}</td></tr>`;
  const W = i => D[i] && D[i].weather || {};
  let h = `<div class="fh"><div><h2>${esc(name || 'Fire weather forecast')}</h2>
    <div class="sub">${lat.toFixed(5)}, ${lng.toFixed(5)} · ${fmtMGA(lat, lng)}</div>
    <div class="sub">District: <b>${esc(dn || 'not found')}</b>${dist && dist.km ? ` (nearest, ${dist.km.toFixed(1)} km)` : ''} · Council: <b>${esc(subName || ln || 'not found')}</b>${lga && lga.km ? ` (nearest, ${lga.km.toFixed(1)} km)` : ''}</div></div>
    <button type="button" id="fcclose" title="Close">✕</button></div><div class="fb">`;
  if(!days.length || !dn){
    h += `<p>${!days.length ? 'The saved forecast has no days in it.' : 'This spot isn’t inside a Tasmanian fire weather district.'}</p></div>`;
    fcSheet.innerHTML = h; return;
  }
  h += `<table><thead><tr><th></th>${days.map((d, i) => `<th${d.day === curCol ? ' class="cur"' : ''}>${shortDate(d.date, d.date_text)}</th>`).join('')}</tr></thead><tbody>`;
  h += grp(`${esc(dn)} district`);
  h += row('Rating / FBI', i => D[i] ? rateHTML(D[i].rating, D[i].fbi) : '–');
  if(subName){ h += grp(`${esc(subName)} (council sub-area${S.find(x => x) && S.find(x => x).k !== dn ? `, rated with ${esc(S.find(x => x).k)}` : ''})`);
    h += row('Rating / FBI', i => S[i] ? rateHTML(S[i].s.rating, S[i].s.fbi) : '–');
    h += row('cHaines', i => S[i] ? flag(S[i].s.cHaines, (S[i].s.red || []).includes('cHaines')) : '–');
    h += row('Wind change (WCDI)', i => S[i] ? flag(S[i].s.wcdi, (S[i].s.red || []).includes('wcdi')) : '–'); }
  h += grp('Weather (district)');
  h += row('Max temp °C', i => esc(W(i).temp ?? '–'));
  h += row('Min RH %', i => esc(W(i).rh ?? '–'));
  h += row('Wind km/h', i => W(i).windDir ? `${esc(W(i).windDir)} ${esc(W(i).windSpeed)}` : '–');
  h += row('Gusts km/h', i => esc(W(i).gust ?? '–'));
  h += row('1500 m wind', i => W(i).wind1500Dir ? `${esc(W(i).wind1500Dir)} ${esc(W(i).wind1500Speed)}` : '–');
  h += row('Mixing height m', i => esc(W(i).mixHeight ?? '–'));
  h += row('Rain mm', i => esc(W(i).rain ?? '–'));
  h += row('cHaines', i => D[i] ? flag(D[i].cHaines, (D[i].red || []).includes('cHaines')) : '–');
  h += row('Wind change (WCDI)', i => D[i] ? flag(D[i].wcdi, (D[i].red || []).includes('wcdi')) : '–');
  if(D.some(d => d && d.tal)) h += row('Thunderstorm (TAL)', i => esc(D[i] ? D[i].tal : '–'));
  if(D.some(d => d && d.minorFuel)) h += row('Minor fuel ≥ Extreme', i => esc(D[i] && D[i].minorFuel || '–'));
  // Fuel types, in the order of the first day's coverage
  const fuels = ((D.find(d => d && d.fuels) || {}).fuels || []).filter(f => f.share == null || f.share > 0);
  if(fuels.length){ h += grp('FBI by fuel type (district)');
    for(const f of fuels) h += row(`${esc(f.type)}${f.share != null ? ` <span style="font-weight:400;color:#777">${f.share}%</span>` : ''}`, i => {
      const x = D[i] && (D[i].fuels || []).find(g => g.type === f.type); if(!x) return '–';
      const pc = x.ge100 && +x.ge100.cover ? [100, x.ge100.cover] : x.ge50 && +x.ge50.cover ? [50, x.ge50.cover] : x.ge24 && +x.ge24.cover ? [24, x.ge24.cover] : null;
      return fbiChip(x.fbi, pc ? `${pc[1]}% of the district reaches FBI ${pc[0]}+` : ''); });
    const cov = (i, k) => { const s = D[i] && D[i].fuelSummary && D[i].fuelSummary[k]; const band = {ge24: 24, ge50: 50, ge100: 100}[k];
      return s && +s.cover ? `<span class="fbi" style="background:${RCOL[fbiBand(band)]};color:${band === 100 ? '#fff' : '#222'}">${esc(s.cover)}%</span>${s.from ? `<br>from ${esc(s.from)}` : ''}${s.dur ? `<br>dur ${esc(s.dur)}` : ''}` : '–'; };
    for(const [k, t] of [['ge24', 'Area FBI ≥ 24'], ['ge50', 'Area FBI ≥ 50'], ['ge100', 'Area FBI ≥ 100']])
      if(D.some(d => d && d.fuelSummary && d.fuelSummary[k] && +d.fuelSummary[k].cover)) h += row(t, i => cov(i, k));
  }
  h += '</tbody></table>';
  h += days.filter(d => d.text).map(d => `<p class="txt"><b>${shortDate(d.date, d.date_text).replace('<br>', ' ')}</b> ${esc(d.text)}</p>`).join('');
  const iss = days[0].issued || '', cap = data.captured || '';
  h += `<div class="note">${esc(iss)}${cap ? ` Saved to the archive ${esc(cap.slice(0,10))} ${esc(cap.slice(11,13))}:${esc(cap.slice(13,15))}.` : ''}
    ${source === 'archive' ? 'Archive mode: the forecast as issued on the chosen date.' : ''}
    District values cover the whole fire weather district and council values the whole council area, not this exact spot.
    FBI values are coloured by AFDRS band (white No rating, green Moderate, yellow High, orange Extreme, dark red Catastrophic). A red cHaines or WCDI is over TFS’s weather alert threshold (cHaines 95th percentile, WCDI over 40).
    Not for safety decisions — check TFS directly.</div>
    <div class="acts"><a href="https://www.fire.tas.gov.au/fire-danger-rating/fire-weather-forecast/" target="_blank" rel="noopener">TFS forecast page</a>
    <button type="button" id="fcpin">📍 Pin here</button></div></div>`;
  fcSheet.innerHTML = h;
  $('fcpin').onclick = () => { addPin(lat, lng, name); };
}

// A paste-the-key box inside the forecast panel, so nobody has to go through Controls
function keyBox(intro){
  return `<p>${intro}</p><p style="margin:6px 0 4px"><b>Paste your access key</b> (the long code starting <code>github_pat_</code>):</p>
    <div style="display:flex;gap:6px"><input id="fckey" type="password" autocomplete="off" placeholder="github_pat_…" style="flex:1;min-width:0;font-size:16px;padding:6px;border:1px solid #bbb;border-radius:4px">
    <button type="button" id="fckeysave" style="font-size:14px;padding:6px 10px;border:1px solid #c8102e;background:#c8102e;color:#fff;border-radius:4px;cursor:pointer">Save</button></div>
    <div class="note">Saved on this phone/browser only. It’s the read-only key made on GitHub for this viewer, not your GitHub password.</div>`;
}
fcSheet.addEventListener('click', e => {
  if(e.target.id !== 'fckeysave') return;
  const k = cleanKey($('fckey').value); if(!k){ $('fckey').focus(); return; }
  $('token').value = k; if(!repoName()) $('repo').value = 'MountainVagabond/tfs-fdr-archive';
  ls.set(TKEY, k); ls.set(RKEY, $('repo').value.trim()); fcCache = {}; fcBounds = null;
  if(source === 'archive') loadIndex(); else loadDay(day);                          // also lets pins read ratings again
  if(fcLast) showForecast(fcLast.lat, fcLast.lng, fcLast.name);
});

async function showForecast(lat, lng, name){
  fcLast = {lat, lng, name};
  if(fcMarker) map.removeLayer(fcMarker);
  fcMarker = L.marker([lat, lng], {icon: L.divIcon({className:'', html:'<div class="fcdot"></div>', iconSize:[14,14], iconAnchor:[7,7]}), interactive:true})
    .on('click', () => showForecast(lat, lng, name)).addTo(map);
  fcSheet.hidden = false;
  const head = `<div class="fh"><div><h2>${esc(name || 'Fire weather forecast')}</h2><div class="sub">${lat.toFixed(5)}, ${lng.toFixed(5)}</div></div><button type="button" id="fcclose" title="Close">✕</button></div><div class="fb">`;
  fcSheet.innerHTML = head + 'Reading the forecast…</div>';
  if(source === 'archive' && !index){ fcSheet.innerHTML = head + 'Reading the archive…</div>'; return; }   // loadIndex() calls back
  const path = fcFile();
  if(!repoBase() || !cleanKey($('token').value)){
    fcSheet.innerHTML = head + keyBox('The forecast comes from your archive, so this phone needs your access key once.') + `
      <div class="acts" style="margin-top:8px"><a href="https://www.fire.tas.gov.au/fire-danger-rating/fire-weather-forecast/" target="_blank" rel="noopener">Open the TFS forecast page</a></div></div>`; return;
  }
  if(!path){ fcSheet.innerHTML = head + `<p>No fire weather forecast was saved for ${esc($('date').value)} up to that issue time. Forecasts have been saved since 3 Nov 2026.</p></div>`; return; }
  try {
    const [data, b] = await Promise.all([fcLoad(path), fcBounds || fcLoad('boundaries.json')]);
    fcBounds = b;
    if(!fcLast || fcLast.lat !== lat || fcLast.lng !== lng) return;                // another spot was tapped meanwhile
    fcRender(lat, lng, name, data, locate(b.districts, lat, lng, 5), locate(b.lgas, lat, lng, 3));
  } catch(e){
    const code = e.message, keyIssue = code == 401 || code == 404 || code == 403;
    fcSheet.innerHTML = head + `<p><b style="color:#c8102e">Couldn’t read the forecast from the archive.</b> ${esc(archiveError(code))}</p>
      <div class="acts"><button type="button" id="fcretry">Try again</button></div>
      ${keyIssue ? keyBox('If the key is wrong or has expired, paste a new one:') : ''}</div>`;
    $('fcretry').onclick = () => { fcCache = {}; showForecast(lat, lng, name); };
  }
}
fcSheet.addEventListener('click', e => { if(e.target.id === 'fcclose'){ fcSheet.hidden = true; fcLast = null; if(fcMarker){ map.removeLayer(fcMarker); fcMarker = null; } } });
// Keep an open forecast in step with the day buttons and the archive date/issue
const fcRefresh = () => { if(fcLast && !fcSheet.hidden) showForecast(fcLast.lat, fcLast.lng, fcLast.name); };
$('days').addEventListener('click', () => setTimeout(fcRefresh, 0));
['date', 'run', 'source'].forEach(id => $(id).addEventListener('change', () => setTimeout(fcRefresh, 0)));

loadDay(0);
</script>
</body>
</html>
